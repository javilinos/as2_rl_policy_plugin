/**:
  ros__parameters:
    plugin_name: rl_policy
    cmd_freq: 100.0 # must equal 1 / dt of the policies
    info_freq: 10.0 # also the rate of the status topic
    use_bypass: false
    desired_pose_frame: /earth
    desired_twist_frame: /earth
    rl_policy:
      config_version: 1
      mission: race # race | hover
      policies:
        names: [race, hover] # race mission: race + hover; hover mission: hover
        files: ["", ""] # exported quadlab_policy files; relative paths resolve against the directory the launch was started from
      vehicle:
        mass_kg: 1.131 # the platform's mass, which re-dimensionalizes the thrust
      motor_speed:
        topic: sensor_measurements/motor_angular_speed # sensor_msgs/JointState, velocity in rad/s in the policy's motor order
        timeout_s: 0.1
      course: # timed gates in pass order, world ENU, yaw in rad; optional gates_shape (0 square, 1 octagon) and gates_virtual (true: nothing to hit)
        gates_x: [12.5, 6.5]
        gates_y: [2.0, 6.0]
        gates_z: [1.45, 1.45]
        gates_yaw: [3.141593, 2.356194]
        bounds_x: [1.0, 22.0]
        bounds_y: [1.0, 32.0]
      race:
        laps: 3
        pass_tolerance_m: 0.9 # a square gate's pass window, physical or virtual: its real half-opening
        valid_half_m: 0.4 # the policy's training window, logged only
        gate_timeout_s: 5.0
        bounds_margin_m: 0.5
        ceiling_m: 10.0
        exit_debounce_steps: 3
      hold:
        setpoint: [0.0, 0.0, 1.5, 0.0] # x, y, z, yaw: the hover mission's hold while no reference is sent, and after_race: setpoint's
        reference: sent_or_configured # sent_or_configured: the hover mission holds the last point of a sent trajectory reference, else setpoint | configured: setpoint
        min_altitude_m: 1.0
        after_race: here # here | setpoint: where the race's finish holds
      debug:
        status_topic: rl_policy/status # "" disables
        step_topic: rl_policy/step # "" disables
